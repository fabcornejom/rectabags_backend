spring.config.import=optional:file:./config/application-local.properties
spring.application.name=backend
server.port=8080

# Origenes exactos de React: desarrollo y vista previa local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/rectabags
spring.datasource.username=rectabags
spring.datasource.password=${DB_PASSWORD}

# JPA: crea y actualiza las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (Parte 2)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=7200000
